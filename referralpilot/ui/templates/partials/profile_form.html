<form id="profile-form" class="mt-4" hx-post="/profile" hx-target="#profile-form" hx-swap="outerHTML">
  {% if errors %}
  <div class="mb-3 rounded-lg border border-rose-200 bg-rose-50 p-3 text-sm text-rose-700">
    <p class="font-medium">Please fix:</p>
    <ul class="mt-1 list-disc pl-5">{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul>
  </div>
  {% endif %}
  <textarea name="profile_json" spellcheck="false" class="input h-[60vh] font-mono text-[12.5px] leading-relaxed">{{ profile_json }}</textarea>
  <div class="mt-3 flex items-center gap-2">
    <button class="btn btn-primary">Save profile</button>
    <button type="button" class="btn" hx-post="/profile/reload" hx-target="#profile-form" hx-swap="outerHTML"
            hx-confirm="Replace the profile with config/candidate_profile.json?">Reload from config file</button>
  </div>
</form>
