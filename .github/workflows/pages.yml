name: GitHub Pages

# Publishes the browser edition of ReferralPilot: the same dashboard, running entirely in the
# visitor's browser (Python on WebAssembly). Scheduled runs re-crawl the job boards every
# 6 hours and republish jobs.json, so the site always has fresh postings.
#
# Publishing: when Settings -> Pages -> Source is "GitHub Actions" the deploy job publishes the
# build directly; otherwise every run pushes it to the gh-pages branch, which Pages serves with
# Source "Deploy from a branch" (gh-pages, / root).

on:
  push:
    branches: [main, master, claude/trusting-curie-4fbtjv]
    paths-ignore: ["**.md"]
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # updates the gh-pages branch when Pages serves from a branch
      pages: read
    outputs:
      pages_mode: ${{ steps.pages.outputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ReferralPilot
        run: pip install -e ".[dev]"

      - name: Run the tests
        if: github.event_name != 'schedule'
        run: pytest -q

      - name: Crawl the job boards
        # Public postings only. A board that fails is simply missing from this snapshot.
        continue-on-error: true
        env:
          DATA_DIR: ${{ runner.temp }}/crawl/data
          EXPORTS_DIR: ${{ runner.temp }}/crawl/exports
          INCLUDE_INTERNSHIPS: "true"
          MAX_REQUIRED_YEARS: "3"
          VERIFY_MX: "false"
        run: referralpilot export-jobs --all-companies --out "$RUNNER_TEMP/jobs.json"

      - name: Cache Pyodide downloads
        uses: actions/cache@v4
        with:
          path: .cache/web-build
          key: web-build-${{ hashFiles('scripts/build_web.py') }}

      - name: Build the site
        run: python scripts/build_web.py --out site --jobs "$RUNNER_TEMP/jobs.json"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Smoke-test the site in Chrome
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PW_CHANNEL: chrome
        run: |
          npm install --no-save --no-package-lock playwright@1
          repo="${GITHUB_REPOSITORY#*/}"
          mkdir -p "$RUNNER_TEMP/www"
          ln -s "$PWD/site" "$RUNNER_TEMP/www/$repo"
          python -m http.server 8000 --bind 127.0.0.1 --directory "$RUNNER_TEMP/www" > /dev/null 2>&1 &
          sleep 1
          node scripts/web_smoke.cjs "http://127.0.0.1:8000/$repo/" --out web-smoke

      - name: Smoke-test in Firefox and WebKit (advisory, does not block publishing)
        if: github.event_name != 'schedule'
        continue-on-error: true
        run: |
          npx --no-install playwright install --with-deps firefox webkit > /dev/null
          repo="${GITHUB_REPOSITORY#*/}"
          status=0
          for browser in firefox webkit; do
            PW_BROWSER=$browser node scripts/web_smoke.cjs "http://127.0.0.1:8000/$repo/" --out "web-smoke/$browser" \
              || { status=1; echo "::warning title=$browser smoke test failed::See the log of this step"; }
          done
          exit $status

      - name: Keep the smoke-test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke
          path: web-smoke
          if-no-files-found: ignore

      - name: How does GitHub Pages publish this repository?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          site=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" || true)
          mode=$(printf '%s' "$site" | jq -r 'if .build_type == "workflow" then "workflow"
            elif .build_type == "legacy" and .source.branch == "gh-pages" and ((.source.path // "/") == "/") then "branch"
            elif .build_type == "legacy" then "other-branch" else "off" end' 2>/dev/null || echo off)
          mode=${mode:-off}
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          case "$mode" in
            workflow) note="Pages publishes from GitHub Actions: the deploy job publishes this build." ;;
            branch) note="Pages serves the gh-pages branch: this run updates it." ;;
            other-branch) note="Pages serves a branch other than gh-pages. This run updates gh-pages; point Settings -> Pages at gh-pages (or at GitHub Actions)." ;;
            *) note="GitHub Pages is not switched on yet. This run pushes the site to the gh-pages branch; in Settings -> Pages choose 'Deploy from a branch: gh-pages' or 'GitHub Actions'." ;;
          esac
          echo "$note"
          echo "### Publishing: $mode" >> "$GITHUB_STEP_SUMMARY"
          echo "$note" >> "$GITHUB_STEP_SUMMARY"
          if [ "$mode" = "off" ] || [ "$mode" = "other-branch" ]; then
            echo "::warning title=GitHub Pages::$note"
          fi

      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.mode == 'workflow'

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.mode == 'workflow'
        with:
          path: site

      - name: Publish to the gh-pages branch
        if: steps.pages.outputs.mode != 'workflow'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One fresh commit each time: the branch only ever holds the current site.
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ReferralPilot ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
          echo "gh-pages now holds the site built from ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    if: needs.build.outputs.pages_mode == 'workflow'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
